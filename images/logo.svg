<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B2C9D" />
      <stop offset="100%" stop-color="#4F2A8A" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5247" />
      <stop offset="100%" stop-color="#F04438" />
    </linearGradient>
    <linearGradient id="darkPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C1A6E" />
      <stop offset="100%" stop-color="#2D1254" />
    </linearGradient>
  </defs>

  <!-- Hexagonal / Ribbon 3D S Icon -->
  <g transform="translate(10, 10)">
    <!-- Top-Right Ribbon Section (Purple) -->
    <path d="M 50 10 L 85 30 L 85 50 L 50 30 Z" fill="url(#purpleGrad)" />
    <path d="M 85 30 L 85 70 L 50 90 L 50 50 Z" fill="url(#darkPurpleGrad)" />
    
    <!-- Left-Middle Ribbon Section (Red-Orange) -->
    <path d="M 50 10 L 15 30 L 15 70 L 50 50 Z" fill="url(#redGrad)" />
    <path d="M 15 70 L 50 90 L 50 100 L 15 80 Z" fill="#D9382C" />

    <!-- Center Fold Accents -->
    <polygon points="50,30 85,50 50,70 15,50" fill="url(#redGrad)" opacity="0.95"/>
    <polygon points="50,50 85,70 50,90 15,70" fill="url(#purpleGrad)"/>
  </g>

  <!-- Typography -->
  <!-- SHREYANSH -->
  <text x="115" y="58" font-family="'Manrope', 'Inter', sans-serif" font-weight="800" font-size="34" fill="#4F2A8A" letter-spacing="1">SHREYANSH</text>
  <!-- ENTERPRISES -->
  <text x="117" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#F04438" letter-spacing="4.5">ENTERPRISES</text>
</svg>
